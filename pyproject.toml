[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-sentinel"
dynamic = ["version"]
description = "Time-aware static security gate for npm package-lock.json dependency updates."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aryan Kumar" }]
keywords = ["npm", "security", "supply-chain", "dependency-audit", "lockfile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "node-semver>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Aryan2569/release-sentinel"
Documentation = "https://github.com/Aryan2569/release-sentinel#readme"
Repository = "https://github.com/Aryan2569/release-sentinel.git"
Issues = "https://github.com/Aryan2569/release-sentinel/issues"
Changelog = "https://github.com/Aryan2569/release-sentinel/blob/main/CHANGELOG.md"

[project.scripts]
sentinel = "release_sentinel.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/release_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/release_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: marks tests that make real network calls (deselect with '-m not network')",
]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (public functions)
    "S",   # flake8-bandit (security)
    "PT",  # flake8-pytest-style
]
ignore = [
    "S101",    # Use of assert (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"scripts/*" = ["ANN", "S", "E501"]

[tool.coverage.run]
source = ["src/release_sentinel"]
omit = ["tests/*"]
