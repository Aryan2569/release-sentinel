name: "CI"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  test:
    name: "Lint, Test & Verify (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-action.lock

      - name: Verify hash-locked requirements
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-action.lock
          pip install --no-deps --no-build-isolation .
          sentinel --version

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Build Package Distributions
        run: |
          python -m build

      - name: Run Pytest Suite
        run: |
          pytest -m "not network"

      - name: Verify Canonical Metrics
        run: |
          python scripts/verify_metrics.py

      - name: Smoke Test Entry Point
        run: |
          sentinel --version
          python -m release_sentinel check --help
