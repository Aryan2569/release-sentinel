# Policy Variant 4: Variant 3 + Obfuscated Code with Size Jump and Blobs
[decision]
single_signal_cap = "WARN"

[[decision.block_requires]]
signals = ["install_script_added", "network_access"]
description = "New install hook that also makes network calls"

[[decision.block_requires]]
signals = ["install_script_added", "dynamic_code"]
description = "New install hook that uses eval or new Function"

[[decision.block_requires]]
signals = ["install_script_added", "credential_file_read"]
description = "New install hook that reads credential files"

[[decision.block_requires]]
signals = ["install_script_added", "long_encoded_blob"]
description = "New install hook combined with obfuscated blobs"

[[decision.block_requires]]
signals = ["install_script_added", "high_entropy_string"]
description = "New install hook combined with high-entropy strings"

[[decision.block_requires]]
signals = ["install_script_added", "shell_profile_write"]
description = "New install hook that modifies shell profiles"

[[decision.block_requires]]
signals = ["native_binary_present", "install_script_added"]
description = "New native binary added alongside a new install hook"

[[decision.block_requires]]
signals = ["process_exec", "credential_file_read"]
description = "Process execution co-occurring with credential file access"

[[decision.block_requires]]
signals = ["dynamic_code", "network_access"]
description = "Dynamic code evaluation combined with network access"

[[decision.block_requires]]
signals = ["install_script_added", "process_exec"]
description = "New install hook that executes system processes"

[[decision.block_requires]]
signals = ["env_enumeration", "network_access"]
description = "Environment variable enumeration combined with network access"

[[decision.block_requires]]
signals = ["env_enumeration", "hardcoded_url"]
description = "Environment variable enumeration combined with outbound URL"

[[decision.block_requires]]
signals = ["env_enumeration", "hardcoded_ip"]
description = "Environment variable enumeration combined with outbound IP"

[[decision.block_requires]]
signals = ["install_script_network"]
description = "Install hook downloads from network"

[[decision.block_requires]]
signals = ["install_script_executes"]
description = "Install hook executes system commands"

[[decision.block_requires]]
signals = ["install_script_dynamic"]
description = "Install hook executes dynamic code"

[[decision.block_requires]]
signals = ["decode_and_execute"]
description = "Decode-then-execute obfuscated payload chain"

[[decision.block_requires]]
signals = ["credential_leak"]
description = "Credential file read co-occurring with network access in same file"

# CI workflow corroborations
[[decision.block_requires]]
signals = ["ci_write", "registry_token"]
description = "CI workflow modification combined with secret or credential token"

[[decision.block_requires]]
signals = ["ci_write", "hardcoded_ip"]
description = "CI workflow modification combined with hardcoded IP address"

[[decision.block_requires]]
signals = ["ci_write", "hardcoded_url"]
description = "CI workflow modification combined with outbound URL"

# Obfuscated code corroborations
[[decision.block_requires]]
signals = ["obfuscated_code", "network_access"]
description = "Obfuscated code combined with network access"

[[decision.block_requires]]
signals = ["obfuscated_code", "hardcoded_ip"]
description = "Obfuscated code combined with hardcoded IP address"

[[decision.block_requires]]
signals = ["obfuscated_code", "hardcoded_url"]
description = "Obfuscated code combined with outbound URL"

[[decision.block_requires]]
signals = ["obfuscated_code", "process_exec"]
description = "Obfuscated code combined with process execution"

[[decision.block_requires]]
signals = ["obfuscated_code", "env_enumeration"]
description = "Obfuscated code combined with environment enumeration"

[[decision.block_requires]]
signals = ["obfuscated_code", "install_script_added"]
description = "Obfuscated code combined with new lifecycle script"

[[decision.block_requires]]
signals = ["obfuscated_code", "registry_token"]
description = "Obfuscated code combined with secret token"

[[decision.block_requires]]
signals = ["obfuscated_code", "long_encoded_blob"]
description = "Obfuscated code combined with long encoded blob"

[[decision.block_requires]]
signals = ["obfuscated_code", "large_size_jump"]
description = "Obfuscated code combined with large package size jump"

[severity_overrides]
install_script_changed = "MEDIUM"
dependency_added = "LOW"
dependency_removed = "INFO"
dependency_version_changed = "INFO"
unresolvable_dependency = "INFO"
large_file_count_jump = "LOW"
new_files_summary = "LOW"

[full_scan]
single_signal_cap = "WARN"

[[full_scan.block_requires]]
signals = ["install_script_network"]
description = "Install-time script that downloads from the network"

[[full_scan.block_requires]]
signals = ["install_script_executes"]
description = "Install-time script that executes system processes"

[[full_scan.block_requires]]
signals = ["install_script_dynamic"]
description = "Install-time script that evaluates dynamic code"

[[full_scan.block_requires]]
signals = ["decode_and_execute"]
description = "Decode-then-execute obfuscated payload chain"

[[full_scan.block_requires]]
signals = ["credential_leak"]
description = "Credential file read co-occurring with network access in the same file"

[[full_scan.block_requires]]
signals = ["ci_write", "registry_token"]
description = "CI workflow modification combined with secret or credential token"

[[full_scan.block_requires]]
signals = ["ci_write", "hardcoded_ip"]
description = "CI workflow modification combined with hardcoded IP address"

[[full_scan.block_requires]]
signals = ["ci_write", "hardcoded_url"]
description = "CI workflow modification combined with outbound URL"

[[full_scan.block_requires]]
signals = ["obfuscated_code", "network_access"]
description = "Obfuscated code combined with network access"

[[full_scan.block_requires]]
signals = ["obfuscated_code", "hardcoded_ip"]
description = "Obfuscated code combined with hardcoded IP address"

[[full_scan.block_requires]]
signals = ["obfuscated_code", "hardcoded_url"]
description = "Obfuscated code combined with outbound URL"

[[full_scan.block_requires]]
signals = ["obfuscated_code", "process_exec"]
description = "Obfuscated code combined with process execution"

[full_scan.severity_overrides]
native_binary_present = "LOW"
unresolvable_dependency = "INFO"
