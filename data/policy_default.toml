# Release Sentinel Default Policy (v1.5 Low-Noise Profile)
#
# Optimized for developer usability in continuous integration:
# - Blocks ONLY high-confidence indicators (install-time exfiltration, download+exec,
#   credential reading, CI tampering with tokens/hosts, precise decode-and-execute).
# - Standalone code characteristics (minified chunks, CLI bundles, env accesses) cap at WARN.
#
# For strict research/reproducibility evaluation matching v1.4, use `--profile strict`.

[decision]
single_signal_cap = "WARN"

# 1. Install-time script downloading and executing fetched content
[[decision.block_requires]]
signals = ["install_script_network"]
description = "Install-time script downloads from network"

[[decision.block_requires]]
signals = ["install_script_added", "network_access"]
description = "Added install hook that accesses network"

[[decision.block_requires]]
signals = ["install_script_added", "network_access", "process_exec"]
description = "Added install hook accesses network and executes system processes"

# 2. Install-time script executing inline shell with fetched content
[[decision.block_requires]]
signals = ["install_script_executes", "network_access"]
description = "Install-time execution combined with network access"

[[decision.block_requires]]
signals = ["install_script_executes", "hardcoded_url"]
description = "Install-time execution combined with external URL"

[[decision.block_requires]]
signals = ["install_script_executes", "hardcoded_ip"]
description = "Install-time execution combined with external IP"

# 3. Install-time script decodes and executes
[[decision.block_requires]]
signals = ["install_script_dynamic"]
description = "Install-time script evaluates dynamic code"

[[decision.block_requires]]
signals = ["install_script_added", "dynamic_code"]
description = "Added install hook uses dynamic code execution"

# 4. Install-time script reads credential files
[[decision.block_requires]]
signals = ["install_script_credential_read"]
description = "Install-time script accesses credential files"

[[decision.block_requires]]
signals = ["install_script_added", "credential_file_read"]
description = "Added install hook reads credential files"

[[decision.block_requires]]
signals = ["process_exec", "credential_file_read"]
description = "Process execution co-occurring with credential file access"

# 5. Install-time script enumerates env vars
[[decision.block_requires]]
signals = ["install_script_env_harvesting"]
description = "Install-time script enumerates environment variables in bulk"

[[decision.block_requires]]
signals = ["install_script_added", "env_enumeration"]
description = "Added install hook enumerates environment variables"

# 6. CI workflow injection combined with token or host references
[[decision.block_requires]]
signals = ["ci_write", "registry_token"]
description = "CI workflow modification combined with secret token"

[[decision.block_requires]]
signals = ["ci_write", "hardcoded_ip"]
description = "CI workflow modification combined with hardcoded IP address"

[[decision.block_requires]]
signals = ["ci_write", "hardcoded_url"]
description = "CI workflow modification combined with outbound URL"

# 7. Precise decode-then-execute
[[decision.block_requires]]
signals = ["decode_and_execute"]
description = "Precise decode-then-execute obfuscated payload chain"

# 8. Credential leak
[[decision.block_requires]]
signals = ["credential_leak"]
description = "Credential file read co-occurring with network access in same file"

[severity_overrides]
hollow_dependency_injection = "MEDIUM"
lookalike_dependency_name = "MEDIUM"

install_script_changed = "MEDIUM"
dependency_added = "LOW"
dev_dependency_added = "INFO"
peer_dependency_added = "INFO"
dependency_removed = "INFO"
dependency_version_changed = "INFO"
large_file_count_jump = "LOW"
new_files_summary = "LOW"
bin_entry_added = "LOW"
bin_entry_changed = "LOW"

[full_scan]
single_signal_cap = "WARN"

[[full_scan.block_requires]]
signals = ["install_script_network"]
description = "Install-time script that downloads from the network"

[[full_scan.block_requires]]
signals = ["install_script_dynamic"]
description = "Install-time script that evaluates dynamic code"

[[full_scan.block_requires]]
signals = ["install_script_credential_read"]
description = "Install-time script that accesses credential files"

[[full_scan.block_requires]]
signals = ["install_script_env_harvesting"]
description = "Install-time script that enumerates environment variables in bulk"

[[full_scan.block_requires]]
signals = ["install_script_executes", "install_script_network"]
description = "Install-time script that executes commands and accesses network"

[[full_scan.block_requires]]
signals = ["credential_leak"]
description = "Credential file read co-occurring with network access in the same file"

[[full_scan.block_requires]]
signals = ["ci_write", "registry_token"]
description = "CI workflow modification combined with secret token"

[[full_scan.block_requires]]
signals = ["ci_write", "hardcoded_ip"]
description = "CI workflow modification combined with hardcoded IP address"

[[full_scan.block_requires]]
signals = ["ci_write", "hardcoded_url"]
description = "CI workflow modification combined with outbound URL"

[full_scan.severity_overrides]
native_binary_present = "LOW"
bin_entry_added = "LOW"
bin_entry_changed = "LOW"
