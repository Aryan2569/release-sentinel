name: "Release Sentinel Lockfile Gate"
description: "Time-aware static security gate for npm package-lock.json dependency updates."
author: "Release Sentinel Contributors"

branding:
  icon: "shield"
  color: "blue"

inputs:
  lockfile:
    description: "Path to npm package-lock.json file"
    required: false
    default: "package-lock.json"
  fail-on:
    description: "Gate failure condition: 'block', 'warn', or 'never'"
    required: false
    default: "block"
  comment:
    description: "Whether to post/update a GitHub PR comment with findings"
    required: false
    default: "true"
  comment-on:
    description: "Gate condition for posting PR comments: 'block', 'notable', 'warn', or 'always'"
    required: false
    default: "notable"
  experimental-hollow:
    description: "Enable experimental hollow-release detection (post-hoc WARN-only heuristic)"
    required: false
    default: "true"
  max-packages:
    description: "Maximum changed packages to scan before capping"
    required: false
    default: "300"
  policy:
    description: "Path to a custom TOML policy file to overlay"
    required: false
    default: ""
  profile:
    description: "Policy profile: 'default' (low-noise) or 'strict' (frozen v1.4 research policy)"
    required: false
    default: "default"
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@39cd14951b08e74b54015eac00f077de37722e50 # v5.1.1
      with:
        python-version: "3.12"

    - name: Cache npm registry tarballs
      uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
      with:
        path: ~/.cache/release_sentinel
        key: ${{ runner.os }}-sentinel-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-sentinel-

    - name: Install Release Sentinel
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Fetch base ref
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          git fetch origin "$BASE_REF" --depth=1 || true
        fi

    - name: Run Release Sentinel check
      id: run-check
      shell: bash
      env:
        LOCKFILE: ${{ inputs.lockfile }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXPERIMENTAL_HOLLOW: ${{ inputs.experimental-hollow }}
        MAX_PACKAGES: ${{ inputs.max-packages }}
        POLICY: ${{ inputs.policy }}
        PROFILE: ${{ inputs.profile }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        ARGS=(check --format markdown --head "$LOCKFILE" --fail-on "$FAIL_ON" --max-packages "$MAX_PACKAGES" --profile "$PROFILE" --json-output-file release_sentinel_report.json)
        if [ "$EXPERIMENTAL_HOLLOW" = "true" ]; then
          ARGS+=(--experimental-hollow)
        fi
        if [ -n "$POLICY" ]; then
          ARGS+=(--policy "$POLICY")
        fi
        if [ -n "$BASE_REF" ]; then
          ARGS+=(--base-ref "origin/$BASE_REF")
        else
          ARGS+=(--base-ref "HEAD~1")
        fi

        set +e
        sentinel "${ARGS[@]}" > release_sentinel_report.md
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        if [ -f release_sentinel_report.md ]; then
          cat release_sentinel_report.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$EXIT_CODE"

    - name: Post or update PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMENT_ON: ${{ inputs.comment-on }}
      run: |
        if [ ! -f release_sentinel_report.md ]; then
          echo "No report file generated; skipping comment."
          exit 0
        fi

        # Evaluate comment-on condition
        SHOULD_COMMENT=$(python -c "
        import json, sys
        from release_sentinel.lockfile import should_post_comment
        try:
            with open('release_sentinel_report.json', 'r', encoding='utf-8') as f:
                rep = json.load(f)
            print('true' if should_post_comment(rep, sys.argv[1]) else 'false')
        except Exception:
            # Fall back to posting on BLOCK or if report cannot be parsed
            print('true')
        " "$COMMENT_ON")

        if [ "$SHOULD_COMMENT" != "true" ]; then
          echo "Skipping PR comment (findings do not meet notable threshold under comment-on: $COMMENT_ON). Step summary is preserved."
          exit 0
        fi

        MARKER="<!-- release-sentinel-pr-comment -->"
        BODY=$(cat release_sentinel_report.md)

        COMMENTS_JSON=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" 2>/dev/null || echo "[]")
        EXISTING_ID=$(echo "$COMMENTS_JSON" | python -c "
        import sys, json
        marker = sys.argv[1]
        try:
            data = json.load(sys.stdin)
            found = [str(c['id']) for c in data if marker in c.get('body', '')]
            print(found[0] if found else '')
        except Exception:
            print('')
        " "$MARKER")

        if [ -n "$EXISTING_ID" ]; then
          echo "Updating existing PR comment #$EXISTING_ID..."
          gh api -X PATCH "/repos/$REPO/issues/comments/$EXISTING_ID" -f body="$BODY" 2>/dev/null || \
            echo "::warning::Failed to update PR comment (fork PR or read-only token). Step summary is preserved."
        else
          echo "Posting new PR comment..."
          gh api -X POST "/repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" 2>/dev/null || \
            echo "::warning::Failed to post PR comment (fork PR or read-only token). Step summary is preserved."
        fi
