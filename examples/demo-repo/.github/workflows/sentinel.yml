name: "Release Sentinel Dependency Gate"

on:
  pull_request:
    paths:
      - "package-lock.json"

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post review comments on the pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Audit npm dependency changes
        uses: Aryan2569/release-sentinel@v0.5.0
        with:
          lockfile: "package-lock.json"
          fail-on: "block"
          comment-on: "notable"
          profile: "default"
