name: "Release Sentinel Dependency Gate"

on:
  pull_request:
    paths:
      - "package-lock.json"

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post review comments on the pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit npm dependency changes
        uses: <your-github-user>/release-sentinel@v0.5.0
        with:
          lockfile: "package-lock.json"
          fail-on: "block"
          comment-on: "notable"
          profile: "default"
